<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css" />
  <title>Admin Tools</title>
  <style>
    .admin-nav {
      display: flex;
      flex-direction: column;
      gap: 0.7em;
      margin-bottom: 1.3em;
    }
    .admin-nav-btn {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 0.7em 1.2em;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.08em;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.09);
    }
    .admin-nav .blue-btn, .admin-nav .green-btn {
      color: #fff !important;
      font-weight: 700 !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.18);
    }
    .blue-btn {
      background: #1976d2;
    }
    .blue-btn:hover { background: #1565c0; }
    .green-btn {
      background: #388e3c;
    }
    .green-btn:hover { background: #256b27; }
    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
      margin-bottom: 1em;
    }
    .admin-actions button {
      flex: 1 1 180px;
      min-width: 140px;
      font-size: 1em;
      padding: 0.7em 1.2em;
      cursor: pointer;
      color: #222;
      text-shadow: none;
    }
    .action-blue-btn {
      background: #1976d2;
      color: #fff !important;
      font-weight: 700 !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.18);
    }
    .action-blue-btn:hover {
      background: #1565c0;
    }
    @media (prefers-color-scheme: dark) {
      .admin-actions button {
        color: #222;
      }
      .blue-btn, .green-btn {
        color: #fff !important;
      }
    }
    @media (prefers-color-scheme: light) {
      .admin-actions button {
        color: #fff;
      }
      .admin-actions .action-blue-btn {
        color: #fff !important;
        font-weight: 700 !important;
      }
      .admin-nav .blue-btn {
        color: #fff !important;
      }
      .admin-nav .green-btn {
        color: #fff !important;
      }
    }
    #log-output {
      width: 100%;
      min-height: 160px;
      font-family: monospace;
      font-size: 1em;
      margin-top: 1em;
      resize: vertical;
    }
    @media (max-width: 700px) {
      .admin-nav {
        gap: 0.5em;
      }
      .admin-nav-btn {
        width: 100%;
        font-size: 1em;
        margin: 0;
      }
      .admin-actions {
        flex-direction: column;
      }
      .admin-actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h2>Admin: Manual Updates</h2>
  <div class="admin-nav">
    <a href="{{ url_for('admin_history') }}" class="admin-nav-btn blue-btn">View administrative history</a>
    <a href="{{ url_for('reported_questions') }}" class="admin-nav-btn green-btn">Reported Questions</a>
    <a href="{{ url_for('country_updates') }}" class="admin-nav-btn green-btn">Country Updates</a>
  </div>
  <div class="admin-actions">
    <button onclick="runUpdate('update_new_country_data')">Update new countries</button>
    <button onclick="runUpdate('update_blanks_with_ai')">Update blanks via AI</button>
    <button onclick="runUpdate('update_reported_questions_with_ai')">Update reported questions via AI</button>
    <button onclick="runUpdate('update_approved_questions')">Propagate approved questions</button>
    <button onclick="runUpdate('update_approved_blanks')">Propagate approved blanks</button>
    <button onclick="runUpdate('reload_quiz_data')">Reload Quiz Data</button>
  </div>
  <textarea id="log-output" readonly placeholder="Execution output will appear here..."></textarea>
  <a href="/" class="back-btn" style="display:inline-block;margin-bottom:1em;padding:0.5em 1.2em;background:#333;color:#fff;border-radius:5px;text-decoration:none;font-weight:bold;">&larr; Back</a>
  <script>
    const logOutput = document.getElementById('log-output');
    function runUpdate(action) {
      logOutput.value = "Executando... Isso pode levar alguns minutos.";
      fetch(`/admin/run_update/${action}`, {method: 'POST'})
        .then(res => res.json())
        .then(data => {
          logOutput.value = data.output;
        })
        .catch(e => {
          logOutput.value = 'Erro: ' + e;
        });
    }
  </script>
</body>
</html>
